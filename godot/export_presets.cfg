variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"theme-color\" content=\"#070814\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<style>
html,body{background:#070814}
#kayos-rotate{display:none;position:fixed;inset:0;z-index:20;background:#070814;color:#f3dfa8;font:20px/1.4 Georgia,serif;align-items:center;justify-content:center;text-align:center;padding:24px;flex-direction:column;gap:14px}
#kayos-rotate small{color:#9aa0b4;font-size:14px}
@media (orientation:portrait) and (max-width:900px){#kayos-rotate{display:flex}}
</style>
<script>
window.addEventListener('DOMContentLoaded',function(){
  var r=document.createElement('div');r.id='kayos-rotate';
  r.innerHTML='KAYOS: NoS demo 1<div>Turn your phone sideways to play.</div><small>Landscape, sound on.</small>';
  document.body.appendChild(r);
  var asked=false;
  document.addEventListener('touchend',function(){
    if(asked)return;asked=true;
    var el=document.documentElement;
    try{var p=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);if(p&&p.catch)p.catch(function(){});}catch(e){}
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(function(){});}catch(e){}
  },{passive:true});
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
